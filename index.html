<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experience Media - نظام الحسابات وإدارة المشاريع</title>
    <link rel="icon" href="brand/logo-mark-color.webp" type="image/webp">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#00ADEF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="XM حسابات">
    <script>
        // Apply the saved theme before first paint to avoid a flash of the wrong theme.
        try {
            const savedTheme = localStorage.getItem('exp_media_theme');
            if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
        } catch (err) { /* storage unavailable */ }
    </script>
    <link rel="stylesheet" href="css/app.css?v=4.2">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="#/" class="brand" aria-label="الرئيسية">
                <img src="brand/logo-horizontal-color.webp" alt="Experience Media — اكسبيرينس ميديا" class="brand-logo logo-light">
                <img src="brand/logo-horizontal-reverse.webp" alt="Experience Media — اكسبيرينس ميديا" class="brand-logo logo-dark">
                <div class="brand-divider"></div>
                <div class="brand-text">
                    <h1 class="brand-title">نظام الحسابات وإدارة المشاريع</h1>
                    <p class="brand-sub">الجنيه السوداني والجنيه المصري والدولار</p>
                </div>
            </a>
            <div class="header-tools">
                <div class="fx-bar">
                    <span class="fx-label">أسعار اليوم</span>
                    <label class="fx-field">
                        <span>الجنيه المصري</span>
                        <input type="number" id="fxEgpInput" step="0.5" min="0.01" class="fx-input" aria-label="سعر الجنيه المصري بالسوداني اليوم">
                        <span>ج.س</span>
                    </label>
                    <label class="fx-field">
                        <span>الدولار</span>
                        <input type="number" id="fxUsdInput" step="1" min="0.01" class="fx-input" placeholder="—" aria-label="سعر الدولار بالسوداني اليوم">
                        <span>ج.س</span>
                    </label>
                </div>
                <button type="button" class="sync-badge pill hidden" id="syncBadge"></button>
                <button type="button" class="theme-toggle" id="themeToggle" aria-label="تبديل الوضع الفاتح والداكن" title="تبديل الوضع الفاتح والداكن">◐</button>
            </div>
        </div>
        <nav class="nav" id="mainNav" aria-label="التنقل الرئيسي"></nav>
    </header>

    <main class="main-container" id="app"></main>

    <footer>
        <span><strong>اكسبيرينس ميديا</strong> · نصنع تجارب إعلامية ترسخ في الأذهان</span>
        <span>تعمل دون إنترنت · المزامنة والنسخ الاحتياطي من <a href="#/settings">الإعدادات</a></span>
    </footer>

    <div id="formModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <form class="modal-body card" id="modalForm" novalidate>
            <h3 id="modalTitle" class="modal-title"></h3>
            <div id="modalFields" class="modal-fields"></div>
            <p class="form-error" id="modalError" role="alert"></p>
            <div class="modal-actions">
                <button type="button" data-action="close-modal" class="btn btn-quiet">إلغاء</button>
                <button type="submit" class="btn btn-primary" id="modalSubmit">حفظ</button>
            </div>
        </form>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <div id="printArea"></div>

    <script src="js/util.js?v=4.2"></script>
    <script src="js/store.js?v=4.2"></script>
    <script src="js/calc.js?v=4.2"></script>
    <script src="js/ui.js?v=4.2"></script>
    <script src="js/forms.js?v=4.2"></script>
    <script src="js/views.js?v=4.2"></script>
    <script src="js/audit.js?v=4.2"></script>
    <script src="js/sync.js?v=4.2"></script>
    <script src="js/share.js?v=4.2"></script>
    <script src="js/print.js?v=4.2"></script>
    <script src="js/app.js?v=4.2"></script>
</body>
</html>
